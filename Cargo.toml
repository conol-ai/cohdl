[workspace]
members = [
    "crates/cohdl-syntax",
    "crates/cohdl-parser",
    "crates/cohdl-sema",
    "crates/cohdl-drc",
    "crates/cohdl-codegen-kicad",
    "crates/cohdl-lsp",
    "crates/cohdl-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/conol/cohdl"

[workspace.dependencies]
pest = "2.7"
pest_derive = "2.7"
clap = { version = "4", features = ["derive"] }
termcolor = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

[package]
name = "cohdl"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
cohdl-parser = { path = "crates/cohdl-parser" }
cohdl-syntax = { path = "crates/cohdl-syntax" }
cohdl-sema = { path = "crates/cohdl-sema" }
cohdl-drc = { path = "crates/cohdl-drc" }

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain (incl. clippy lint set) is pinned by rust-toolchain.toml
      # so CI and local runs never skew; dtolnay@stable would override the
      # pin, so pass the pinned version explicitly.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # RFC-015: the IPC-2581 schema-validity gate needs xmllint. CI is the
      # authoritative run (locally the test skips with a warning if absent).
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # RFC-019: the VS Code extension is a separate packaging/grammar layer over
  # `cohdl lsp` — its own tooling CI (compile, grammar-coverage test, build the
  # .vsix), not part of the compiler pipeline. Kept in the same workflow so a
  # change touching either surface is gated together.
  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Compile
        run: npm run compile
      - name: Grammar coverage test
        run: npm test
      - name: Package .vsix
        run: npm run package

  # registry.cohdl.org (RFC-030) — its own tooling CI: vitest (incl. the
  # cross-language RFC-029 hash vector against src/hash.rs), typecheck,
  # oxlint, and a full vite build (worker + SPA). No Cloudflare credentials
  # needed; deploys stay manual (wrangler deploy).
  registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci || npm install
      - name: Test
        run: npx vitest run
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx oxlint src test
      - name: Build
        run: npm run build

  # cohdl.org — the project site and pre-launch waitlist. A static page plus a
  # small Worker, so the gate is a typecheck and a dry-run build of the Worker
  # bundle. No Cloudflare credentials needed; deploys stay manual.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/site-build

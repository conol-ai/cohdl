[package]
name = "cohdl"
version = "0.5.0"
edition = "2021"
description = "CoHDL v2 — the AI-native PCB schematic language compiler"
license = "MIT"
repository = "https://github.com/conol-ai/cohdl"
default-run = "cohdl"

[[bin]]
name = "cohdl"
path = "src/main.rs"

[dependencies]
# RFC-014 / DR-020: the project's single scoped dependency exception. The LSP
# spec's message shapes are large and externally versioned — unlike CoHDL's
# own small, fixed output formats, they are not worth hand-rolling. The
# JSON-RPC transport loop itself stays hand-rolled (src/lsp.rs). serde and
# serde_json are lsp-types' own (de)serialization requirements; they are used
# only in the LSP layer, never in the compiler pipeline or emitters.
lsp-types = "=0.97.0"
serde = "=1.0.219"
serde_json = "=1.0.140"

[dev-dependencies]

[profile.release]
debug = true

# Distribution builds (.github/workflows/release-cohdl.yml): release codegen
# with symbols stripped. [profile.release] keeps debug = true for local
# profiling, which would bloat every shipped binary several-fold.
[profile.dist]
inherits = "release"
debug = false
strip = "symbols"

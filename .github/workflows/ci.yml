name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain (incl. clippy lint set) is pinned by rust-toolchain.toml
      # so CI and local runs never skew; dtolnay@stable would override the
      # pin, so pass the pinned version explicitly.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # RFC-015: the IPC-2581 schema-validity gate needs xmllint. CI is the
      # authoritative run (locally the test skips with a warning if absent).
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

[package]
name = "cohdl-explorer"
version = "0.2.0"
edition = "2021"

[dependencies]
cohdl = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[[bin]]
name = "cohdl-explorer"
path = "src/main.rs"
